<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1329"/>
      <stop offset="100%" stop-color="#111C38"/>
    </linearGradient>
    <linearGradient id="cyanBlue1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <pattern id="grid1" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.8" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" fill="url(#bgGrad1)"/>
  <rect width="600" height="360" fill="url(#grid1)"/>

  <!-- Glow circle -->
  <circle cx="300" cy="180" r="140" fill="#06B6D4" opacity="0.08" filter="blur(30px)"/>

  <!-- Terminal Window Mockup -->
  <g transform="translate(60, 40)">
    <!-- Terminal Box -->
    <rect width="480" height="280" rx="12" fill="#0D1527" stroke="#1E293B" stroke-width="1.5"/>
    
    <!-- Titlebar -->
    <rect width="480" height="38" rx="12" fill="#131E35"/>
    <rect y="26" width="480" height="12" fill="#131E35"/>
    
    <!-- Window buttons -->
    <circle cx="22" cy="19" r="6" fill="#EF4444" opacity="0.8"/>
    <circle cx="42" cy="19" r="6" fill="#F59E0B" opacity="0.8"/>
    <circle cx="62" cy="19" r="6" fill="#10B981" opacity="0.8"/>
    
    <!-- Title -->
    <text x="240" y="24" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">guess_number.py - Python 3</text>
    
    <!-- Code / CLI lines -->
    <text x="28" y="72" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="12">$ python guess_number.py</text>
    
    <text x="28" y="102" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">🎯 [Game Engine] Thinking of a number between 1 and 100...</text>
    
    <rect x="28" y="118" width="424" height="34" rx="6" fill="#172545" stroke="#1E3A8A" stroke-width="1"/>
    <text x="40" y="140" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="12">Enter your guess: <tspan fill="#F59E0B">42</tspan></text>
    
    <text x="28" y="180" fill="#EF4444" font-family="'JetBrains Mono', monospace" font-size="12">❌ Too low! Try a higher number. [Attempts: 1]</text>
    
    <rect x="28" y="196" width="424" height="34" rx="6" fill="#172545" stroke="#1E3A8A" stroke-width="1"/>
    <text x="40" y="218" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="12">Enter your guess: <tspan fill="#10B981">78</tspan></text>
    
    <text x="28" y="258" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">🎉 Correct! You guessed 78 in 2 attempts! 🚀</text>
  </g>

  <!-- Python Badge floating bottom-right -->
  <g transform="translate(450, 270)">
    <rect width="115" height="32" rx="16" fill="#1E293B" stroke="#06B6D4" stroke-width="1.2"/>
    <circle cx="20" cy="16" r="6" fill="#38BDF8"/>
    <text x="64" y="21" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Python 3</text>
  </g>
</svg>
