<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F20"/>
      <stop offset="100%" stop-color="#141933"/>
    </linearGradient>
    <linearGradient id="neuralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="360" fill="url(#bgGrad4)"/>

  <!-- Neural Network Diagram Representation -->
  <g transform="translate(60, 40)">
    <rect width="480" height="280" rx="12" fill="#0E1528" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="6,4"/>

    <!-- Neural connection lines -->
    <!-- Input layer to hidden 1 -->
    <line x1="80" y1="70" x2="180" y2="50" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.4"/>
    <line x1="80" y1="70" x2="180" y2="110" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.4"/>
    <line x1="80" y1="70" x2="180" y2="170" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.4"/>
    <line x1="80" y1="140" x2="180" y2="50" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.4"/>
    <line x1="80" y1="140" x2="180" y2="110" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.7"/>
    <line x1="80" y1="140" x2="180" y2="170" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.4"/>
    <line x1="80" y1="210" x2="180" y2="110" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.4"/>
    <line x1="80" y1="210" x2="180" y2="170" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.7"/>
    <line x1="80" y1="210" x2="180" y2="230" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.4"/>

    <!-- Hidden 1 to hidden 2 -->
    <line x1="180" y1="50" x2="280" y2="80" stroke="#60A5FA" stroke-width="1.2" stroke-opacity="0.5"/>
    <line x1="180" y1="110" x2="280" y2="80" stroke="#60A5FA" stroke-width="1.5" stroke-opacity="0.8"/>
    <line x1="180" y1="110" x2="280" y2="140" stroke="#60A5FA" stroke-width="1.5" stroke-opacity="0.8"/>
    <line x1="180" y1="170" x2="280" y2="140" stroke="#60A5FA" stroke-width="1.5" stroke-opacity="0.8"/>
    <line x1="180" y1="170" x2="280" y2="200" stroke="#60A5FA" stroke-width="1.2" stroke-opacity="0.5"/>
    <line x1="180" y1="230" x2="280" y2="200" stroke="#60A5FA" stroke-width="1.2" stroke-opacity="0.5"/>

    <!-- Hidden 2 to output -->
    <line x1="280" y1="80" x2="380" y2="110" stroke="#818CF8" stroke-width="1.5" stroke-opacity="0.7"/>
    <line x1="280" y1="140" x2="380" y2="110" stroke="#818CF8" stroke-width="1.8" stroke-opacity="0.9"/>
    <line x1="280" y1="140" x2="380" y2="170" stroke="#818CF8" stroke-width="1.8" stroke-opacity="0.9"/>
    <line x1="280" y1="200" x2="380" y2="170" stroke="#818CF8" stroke-width="1.5" stroke-opacity="0.7"/>

    <!-- Nodes: Input layer -->
    <circle cx="80" cy="70" r="10" fill="#1E293B" stroke="#06B6D4" stroke-width="2"/>
    <circle cx="80" cy="140" r="10" fill="#1E293B" stroke="#06B6D4" stroke-width="2"/>
    <circle cx="80" cy="210" r="10" fill="#1E293B" stroke="#06B6D4" stroke-width="2"/>

    <!-- Nodes: Hidden 1 -->
    <circle cx="180" cy="50" r="11" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="180" cy="110" r="13" fill="#1E293B" stroke="#38BDF8" stroke-width="2.5"/>
    <circle cx="180" cy="170" r="13" fill="#1E293B" stroke="#38BDF8" stroke-width="2.5"/>
    <circle cx="180" cy="230" r="11" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>

    <!-- Nodes: Hidden 2 -->
    <circle cx="280" cy="80" r="12" fill="#1E293B" stroke="#60A5FA" stroke-width="2"/>
    <circle cx="280" cy="140" r="14" fill="#1E293B" stroke="#60A5FA" stroke-width="2.5"/>
    <circle cx="280" cy="200" r="12" fill="#1E293B" stroke="#60A5FA" stroke-width="2"/>

    <!-- Nodes: Output -->
    <circle cx="380" cy="110" r="13" fill="#1E293B" stroke="#A855F7" stroke-width="2.5"/>
    <circle cx="380" cy="170" r="13" fill="#1E293B" stroke="#A855F7" stroke-width="2.5"/>

    <!-- Centered Upcoming Badge -->
    <g transform="translate(140, 105)">
      <rect width="200" height="70" rx="14" fill="#0F172A" stroke="#06B6D4" stroke-width="1.8" filter="drop-shadow(0px 8px 16px rgba(6, 182, 212, 0.25))"/>
      <circle cx="35" cy="35" r="12" fill="#06B6D4" fill-opacity="0.15"/>
      <text x="35" y="40" font-family="'JetBrains Mono', monospace" font-size="14" text-anchor="middle" fill="#22D3EE">⚡</text>
      <text x="110" y="32" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">IN PLANNING</text>
      <text x="110" y="50" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11">Upcoming AI / ML Project</text>
    </g>

    <text x="240" y="260" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Neural Architecture &amp; Data Pipeline</text>
  </g>
</svg>
