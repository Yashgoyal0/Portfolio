<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="avatarGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <radialGradient id="ambientCyan" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base Circle Frame -->
  <circle cx="160" cy="160" r="150" fill="url(#avatarBg)" stroke="url(#avatarGlow)" stroke-width="3"/>
  <circle cx="160" cy="160" r="142" fill="url(#ambientCyan)"/>

  <!-- Developer Silhouette / Monogram Art -->
  <!-- Head -->
  <circle cx="160" cy="115" r="46" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
  
  <!-- Subtle code brackets around head -->
  <text x="75" y="125" font-family="'JetBrains Mono', monospace" font-size="34" font-weight="700" fill="#06B6D4" opacity="0.6">&lt;</text>
  <text x="245" y="125" font-family="'JetBrains Mono', monospace" font-size="34" font-weight="700" fill="#06B6D4" opacity="0.6">&gt;</text>

  <!-- Monogram on head -->
  <text x="160" y="125" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="800" fill="#F8FAFC" text-anchor="middle" letter-spacing="1">YG</text>

  <!-- Body / Shoulders -->
  <path d="M 85 245 C 85 185, 235 185, 235 245 C 235 270, 85 270, 85 245 Z" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
  
  <!-- Subtle laptop / tech symbol on body -->
  <rect x="125" y="222" width="70" height="38" rx="5" fill="#0F172A" stroke="#06B6D4" stroke-width="1.5"/>
  <line x1="115" y1="260" x2="205" y2="260" stroke="#06B6D4" stroke-width="2"/>
  
  <!-- Active Tech Status Beacon -->
  <circle cx="230" cy="230" r="14" fill="#0F172A" stroke="#10B981" stroke-width="2"/>
  <circle cx="230" cy="230" r="8" fill="#10B981"/>
</svg>
