<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1022"/>
      <stop offset="100%" stop-color="#121D38"/>
    </linearGradient>
    <linearGradient id="cyanBlue3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <rect width="600" height="360" fill="url(#bgGrad3)"/>

  <!-- Browser window mockup -->
  <g transform="translate(50, 35)">
    <!-- Main Frame -->
    <rect width="500" height="290" rx="12" fill="#0D162B" stroke="#1E293B" stroke-width="1.5"/>
    
    <!-- Browser Top Bar -->
    <rect width="500" height="40" rx="12" fill="#14213D"/>
    <rect y="28" width="500" height="12" fill="#14213D"/>
    
    <circle cx="22" cy="20" r="5" fill="#EF4444"/>
    <circle cx="38" cy="20" r="5" fill="#F59E0B"/>
    <circle cx="54" cy="20" r="5" fill="#10B981"/>

    <!-- URL Bar -->
    <rect x="80" y="10" width="340" height="20" rx="10" fill="#090E1A"/>
    <text x="250" y="24" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">https://yashgoyal0.github.io/portfolio</text>

    <!-- Content Preview -->
    <!-- Nav Mockup -->
    <rect x="25" y="55" width="80" height="12" rx="3" fill="#38BDF8"/>
    <rect x="350" y="57" width="35" height="8" rx="2" fill="#64748B"/>
    <rect x="395" y="57" width="35" height="8" rx="2" fill="#64748B"/>
    <rect x="440" y="57" width="35" height="8" rx="2" fill="#64748B"/>

    <!-- Hero Content -->
    <rect x="25" y="90" width="120" height="8" rx="2" fill="#06B6D4" opacity="0.8"/>
    <rect x="25" y="108" width="220" height="18" rx="4" fill="#F8FAFC"/>
    <rect x="25" y="134" width="200" height="10" rx="2" fill="#94A3B8"/>
    <rect x="25" y="150" width="180" height="10" rx="2" fill="#64748B"/>

    <!-- Buttons -->
    <rect x="25" y="175" width="85" height="26" rx="6" fill="#0284C7"/>
    <rect x="120" y="175" width="85" height="26" rx="6" fill="#1E293B" stroke="#334155"/>

    <!-- Right: Code Card Mockup -->
    <rect x="280" y="85" width="195" height="180" rx="8" fill="#131C31" stroke="#1E293B"/>
    <circle cx="295" cy="98" r="3" fill="#EF4444"/>
    <circle cx="305" cy="98" r="3" fill="#F59E0B"/>
    <circle cx="315" cy="98" r="3" fill="#10B981"/>
    
    <text x="295" y="125" fill="#F472B6" font-family="'JetBrains Mono', monospace" font-size="9">const developer = {</text>
    <text x="305" y="143" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="9">name: <tspan fill="#34D399">'Yash Goyal'</tspan>,</text>
    <text x="305" y="161" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="9">role: <tspan fill="#38BDF8">'B.Tech CSE'</tspan>,</text>
    <text x="305" y="179" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="9">focus: <tspan fill="#FBBF24">'Software Eng'</tspan>,</text>
    <text x="305" y="197" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="9">openForInternship: <tspan fill="#60A5FA">true</tspan></text>
    <text x="295" y="215" fill="#F472B6" font-family="'JetBrains Mono', monospace" font-size="9">};</text>

    <!-- Mobile Responsive Mockup overlay -->
    <g transform="translate(18, 170)">
      <rect width="65" height="105" rx="6" fill="#080D1A" stroke="#38BDF8" stroke-width="1.2"/>
      <rect x="8" y="10" width="49" height="6" rx="2" fill="#38BDF8"/>
      <rect x="8" y="22" width="35" height="4" rx="1" fill="#94A3B8"/>
      <rect x="8" y="32" width="49" height="28" rx="3" fill="#1E293B"/>
      <rect x="8" y="65" width="22" height="12" rx="3" fill="#0284C7"/>
    </g>
  </g>
</svg>
